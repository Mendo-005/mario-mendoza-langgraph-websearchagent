[project]
name = "mario-mendoza-langgraph-websearchagent"
version = "0.1.0"
description = "Web app for a LangGraph agent with Tavily search"
readme = "README.md"
authors = [
    { name = "Mendo-05", email = "mendozachaparro73@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.0",
    "langchain-anthropic",
    "langchain-tavily",
    "langgraph",
    "python-dotenv",
]

[project.scripts]
mario-mendoza-langgraph-websearchagent = "mario_mendoza_langgraph_websearchagent.server:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
